name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # The Playwright suite alone takes 9-14 minutes on pull requests (two
    # workers, a dev server, retries on flaky catalogue navigations); with
    # setup, lint, type-check and build the job sits at the old 15-minute
    # limit and was cancelled mid-build.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Entry development history (next.config.ts) reads real commit
          # history per entry; a shallow checkout would make it fail loudly
          # rather than publish wrong dates.
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test rendered routes
        run: pnpm test:e2e

      - name: Build
        run: pnpm build
